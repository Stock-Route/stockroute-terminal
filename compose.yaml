# StockRoute Terminal 本地一键跑:STOCKROUTE_TOKEN=xxx docker compose up → http://localhost:8088
services:
  terminal:
    build: { context: ., dockerfile: docker/Dockerfile }
    ports: ["8088:80"]
    environment:
      # 内置社区令牌(开箱即用);个人 token 可在 .env 覆盖(STOCKROUTE_TOKEN=xxx)
      STOCKROUTE_TOKEN: ${STOCKROUTE_TOKEN:-bz9qgzFXELjTsD4jz9U12tPhDxeQ6E5jlnOiLntf}
    restart: unless-stopped
