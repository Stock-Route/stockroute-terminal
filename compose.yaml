# StockRoute Terminal 本地一键跑:STOCKROUTE_TOKEN=xxx docker compose up → http://localhost:8088
services:
  terminal:
    build: { context: ., dockerfile: docker/Dockerfile }
    ports: ["8088:80"]
    environment:
      STOCKROUTE_TOKEN: ${STOCKROUTE_TOKEN:?请在环境变量或 .env 提供 token(免费注册 https://m-stock.600044.xyz)}
    restart: unless-stopped
